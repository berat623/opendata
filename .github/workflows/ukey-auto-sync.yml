name: UKEY Otomatik Veri ve Dosya Senkronizasyonu

on:
  schedule:
    # 7/24 Bulut Üzerinden Çoklu Zamanlayıcı ile Kesintisiz Otomatik UKEY Kontrolü
    - cron: '*/15 * * * *'
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [ukey-sync]
  push:
    branches:
      - main
    paths:
      - 'scripts/ukey-auto-sync.js'

# Eşzamanlı çakışmaları tamamen engelleyen tekil işlem grubu
concurrency:
  group: ukey-auto-sync-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-ukey:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: UKEY Otomatik Senkronizasyon Motorunu Çalıştır
        run: node scripts/ukey-auto-sync.js
        continue-on-error: false

      - name: Güncellenen UKEY Verilerini Kaydet ve Yayınla (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "UKEY Auto-Sync Cloud"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --strategy-option=theirs origin/main || git rebase --abort 2>/dev/null || true

            git add ukey.json ukey_dosyalar/
            if git diff --staged --quiet; then
              echo "UKEY verilerinde değişiklik yok."
              exit 0
            fi

            git commit -m "chore(ukey): canli UKEY bulut senkronizasyonu" || true
            if git push origin main; then
              echo "UKEY verileri başarıyla GitHub'a gönderildi."
              exit 0
            fi

            echo "Eşzamanlı commit tespit edildi, tekrar deneniyor (Deneme $attempt/3)..."
            sleep 2
          done
