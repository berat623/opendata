name: UKEY Otomatik Veri ve Dosya Senkronizasyonu

on:
  schedule:
    # Her 30 dakikada bir UKEY verilerini otomatik çeker
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/ukey-auto-sync.js'

permissions:
  contents: write

jobs:
  sync-ukey:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: UKEY Otomatik Senkronizasyon Motorunu Çalıştır
        run: node scripts/ukey-auto-sync.js
        continue-on-error: true

      - name: Güncellenen UKEY Verilerini Kaydet (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "UKEY Auto-Sync Bot"
          git add ukey.json ukey_dosyalar/
          if git diff --staged --quiet; then
            echo "Verilerde yeni bir değişiklik yok."
          else
            git commit -m "chore(ukey): otomatik UKEY senkronizasyonu [skip ci]"
            git pull --rebase origin main
            git push
          fi
