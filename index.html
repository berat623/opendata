<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Elektronik Teknolojisi Programı Bilgi Sistemi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,100..1000,0..100&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --md-sys-color-background: #0f131a;
            --md-sys-color-on-background: #e1e2e9;
            --md-sys-color-surface-container: #191c24;
            --md-sys-color-surface-container-high: #232732;
            --md-sys-color-primary: #a8c7fa;
            --md-sys-color-on-primary: #003062;
            --md-sys-color-outline-variant: #424754;
            --md-sys-color-outline: #8c919d;
            --md-sys-color-error: #ffb4ab;
            --md-sys-shape-corner-large: 24px;
            --md-sys-shape-corner-full: 9999px;
            --md-elevation-1: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        *, *::before, *::after, button, input, textarea {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        .material-symbols-outlined { font-size: 22px; display: inline-block; vertical-align: middle; }

        body { 
            background-color: var(--md-sys-color-background); 
            color: var(--md-sys-color-on-background); 
            padding: 16px;
            min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; width: 100%; }

        .header {
            background-color: var(--md-sys-color-surface-container);
            padding: 16px;
            border-radius: var(--md-sys-shape-corner-large);
            border: 1px solid var(--md-sys-color-outline-variant);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left { display: flex; align-items: center; gap: 14px; }
        .logo { width: 52px; height: 52px; object-fit: contain; }
        h1 { font-size: 1.1rem; color: var(--md-sys-color-primary); }
        .sub-header { color: #b1f0d0; font-size: 0.85rem; }

        .m3-card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: var(--md-sys-shape-corner-large);
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 16px;
            margin-bottom: 12px;
        }

        .announcement-item {
            padding: 12px;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .announcement-item:last-child { border-bottom: none; }
        .ann-title { font-weight: bold; color: var(--md-sys-color-primary); margin-bottom: 4px; }
        .ann-date { font-size: 0.75rem; color: var(--md-sys-color-outline); margin-bottom: 6px; }

        .m3-btn-filled {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 8px 16px;
            border-radius: var(--md-sys-shape-corner-full);
            cursor: pointer;
            font-weight: bold;
        }

        .m3-btn-danger {
            background-color: var(--md-sys-color-error);
            color: #600004;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .admin-form input, .admin-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: var(--md-sys-color-surface-container-high);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: #fff;
            border-radius: 8px;
        }

        .footer { text-align: center; color: var(--md-sys-color-outline); font-size: 0.75rem; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <img src="logo.png" alt="BUÜ Logo" class="logo">
                <div>
                    <h1>Elektronik Teknolojisi Programı</h1>
                    <div class="sub-header">Bursa Uludağ Üniversitesi</div>
                </div>
            </div>
            <button id="admin-btn" class="m3-btn-filled" onclick="handleAdminAuth()">Admin Girişi</button>
        </div>

        <!-- Duyurular Listesi -->
        <div class="m3-card">
            <h2><span class="material-symbols-outlined">campaign</span> Akademik Duyurular</h2>
            <div id="announcement-list" style="margin-top: 15px;">
                <p style="color: var(--md-sys-color-outline);">Duyurular yükleniyor...</p>
            </div>
        </div>

        <!-- Admin Paneli (Varsayılan Olarak Gizli) -->
        <div id="admin-panel" class="m3-card" style="display: none; border: 2px solid var(--md-sys-color-primary);">
            <h2><span class="material-symbols-outlined">admin_panel_settings</span> Duyuru Yönetim Paneli</h2>
            <div class="admin-form" style="margin-top: 15px;">
                <input type="text" id="ann-title-input" placeholder="Duyuru Başlığı">
                <textarea id="ann-content-input" rows="3" placeholder="Duyuru İçeriği"></textarea>
                <button class="m3-btn-filled" onclick="addAnnouncement()">Duyuruyu GitHub'a Kaydet</button>
            </div>
        </div>
    </div>

    <div class="footer">BUÜ Elektronik Teknolojisi Programı © 2026</div>

    <script>
        const GITHUB_USERNAME = "berat623";
        const REPO_NAME = "opendata";
        const FILE_PATH = "duyurular.json";

        let userToken = localStorage.getItem("gh_admin_token") || "";
        let announcements = [];

        // Sayfa Yüklendiğinde Otomatik Çalışır
        window.onload = function() {
            if (userToken) {
                showAdminView();
            }
            loadAnnouncements();
        };

        // Admin Giriş / Çıkış İşlemi
        function handleAdminAuth() {
            if (userToken) {
                if (confirm("Admin oturumunu kapatmak istediğinize emin misiniz?")) {
                    localStorage.removeItem("gh_admin_token");
                    userToken = "";
                    document.getElementById('admin-panel').style.display = 'none';
                    document.getElementById('admin-btn').innerText = "Admin Girişi";
                    renderAnnouncements();
                }
            } else {
                const token = prompt("GitHub Personal Access Token Giriniz (Sadece bu tarayıcıya kaydedilecek):");
                if (token) {
                    userToken = token;
                    localStorage.setItem("gh_admin_token", token);
                    showAdminView();
                    renderAnnouncements();
                }
            }
        }

        function showAdminView() {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('admin-btn').innerText = "Çıkış Yap";
        }

        // Duyuruları Okuma
        async function loadAnnouncements() {
            const listDiv = document.getElementById('announcement-list');
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/${FILE_PATH}?t=${Date.now()}`);
                announcements = await res.json();
                renderAnnouncements();
            } catch (err) {
                listDiv.innerHTML = '<p>Henüz duyuru yok veya duyurular yüklenemedi.</p>';
            }
        }

        function renderAnnouncements() {
            const listDiv = document.getElementById('announcement-list');
            listDiv.innerHTML = '';

            if (announcements.length === 0) {
                listDiv.innerHTML = '<p style="color: var(--md-sys-color-outline);">Henüz yapılmış bir duyuru yok.</p>';
                return;
            }

            announcements.forEach((ann) => {
                const item = document.createElement('div');
                item.className = 'announcement-item';
                item.innerHTML = `
                    <div>
                        <div class="ann-title">${ann.title}</div>
                        <div class="ann-date">${new Date(ann.date).toLocaleString('tr-TR')}</div>
                        <div>${ann.content}</div>
                    </div>
                    ${userToken ? `<button class="m3-btn-danger" onclick="deleteAnnouncement(${ann.id})">Sil</button>` : ''}
                `;
                listDiv.appendChild(item);
            });
        }

        // GitHub API ile Kaydetme
        async function saveToGitHub(newList, commitMsg) {
            try {
                const getFileRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${userToken}` }
                });

                if (!getFileRes.ok) {
                    alert("Hata: Token geçersiz veya yetkisi yok! Lütfen tekrar giriş yapın.");
                    localStorage.removeItem("gh_admin_token");
                    location.reload();
                    return;
                }

                const fileData = await getFileRes.json();
                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(newList, null, 2))));

                const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${userToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: commitMsg,
                        content: contentEncoded,
                        sha: fileData.sha
                    })
                });

                if (updateRes.ok) {
                    alert("Başarıyla kaydedildi! GitHub Pages 1 dakika içinde güncellenecektir.");
                    announcements = newList;
                    renderAnnouncements();
                } else {
                    alert("Yazma hatası oluştu.");
                }
            } catch (err) {
                alert("Bağlantı hatası oluştu.");
            }
        }

        function addAnnouncement() {
            const title = document.getElementById('ann-title-input').value;
            const content = document.getElementById('ann-content-input').value;

            if (!title || !content) {
                alert("Lütfen başlık ve içerik doldurun.");
                return;
            }

            const newAnn = {
                id: Date.now(),
                title: title,
                content: content,
                date: new Date().toISOString()
            };

            saveToGitHub([newAnn, ...announcements], `Duyuru eklendi: ${title}`);
            document.getElementById('ann-title-input').value = '';
            document.getElementById('ann-content-input').value = '';
        }

        function deleteAnnouncement(id) {
            if (confirm("Bu duyuruyu silmek istediğinize emin misiniz?")) {
                const newList = announcements.filter(a => a.id !== id);
                saveToGitHub(newList, `Duyuru silindi (ID: ${id})`);
            }
        }
    </script>
</body>
</html>
