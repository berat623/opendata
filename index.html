    <style>
        :root {
            --bg-body: #0b0f19; --bg-surface: #141b2d; --bg-surface-hover: #1e293b;
            --text-main: #f8fafc; --text-muted: #94a3b8;

            --accent: #10b981; --accent-soft: rgba(16,185,129,0.12);
            --warning: #f59e0b; --warning-soft: rgba(245,158,11,0.12);
            --danger: #ef4444; --danger-soft: rgba(239,68,68,0.12);
            --border: rgba(255,255,255,0.08);
            --nav-width: 260px; --banner-h: 44px;
            --radius-lg: 24px; --radius-md: 16px; --radius-sm: 10px;
            --shadow: 0 10px 28px -14px rgba(0,0,0,0.5);
            --timer-gradient: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
            --widget-text: #ffffff; --widget-muted: rgba(255,255,255,0.72); --widget-chip: rgba(255,255,255,0.12);
            --banner-bg: #8a4a12; --banner-text: #fde68a; --logo-bg: #ffffff;
        }
        html.light-mode {
            --bg-body: #f1f5f9; --bg-surface: #ffffff; --bg-surface-hover: #f8fafc;
            --text-main: #0f172a; --text-muted: #64748b;
            --primary: #2563eb; --primary-soft: rgba(37,98,235,0.10);
            --accent: #059669; --accent-soft: rgba(5,150,105,0.08);
            --warning: #d97706; --warning-soft: rgba(217,119,6,0.10);
            --danger: #dc2626; --danger-soft: rgba(220,38,38,0.10);
            --border: rgba(15,23,42,0.08);
            --shadow: 0 10px 28px -14px rgba(2,6,23,0.10);
            --timer-gradient: linear-gradient(135deg, #d1fae5 0%, #f0fdf4 100%);
            --widget-text: #0f172a; --widget-muted: rgba(15,23,42,0.65); --widget-chip: rgba(15,23,42,0.06);
            --banner-bg: #fde68a; --banner-text: #92400e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Parkinsans', sans-serif; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
        body { background: var(--bg-body); color: var(--text-main); overflow-x: hidden; }
        body.modal-open, body.drawer-open { overflow: hidden; }

        ::selection { background: var(--primary); color: #fff; }
        button, .nav-item, a { touch-action: manipulation; cursor: pointer; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

        .material-symbols-rounded { font-variation-settings: 'FILL' 1; user-select: none; }

        .icon-chip { width: 38px; height: 38px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); flex-shrink: 0; }
        .icon-chip .material-symbols-rounded { font-size: 22px; }
        .icon-chip.accent { background: var(--accent-soft); color: var(--accent); }
        .icon-chip.warn { background: var(--warning-soft); color: var(--warning); }
        .icon-chip.on-gradient { background: var(--widget-chip); color: var(--widget-text); }

        .btn, .nav-item, .stat { position: relative; }

        .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(239,68,68,0.25); }
        button.menu-btn { display: none; }

        .skeleton { background: var(--bg-surface-hover); border-radius: 10px; }

        .stat { display: flex; gap: 12px; align-items: center; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 15px 17px; box-shadow: var(--shadow); cursor: pointer; min-width: 0; }
