<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUÜ - Elektronik Teknolojisi Dosya Sunucusu</title>

    <!-- Google Fonts: Parkinsans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Parkinsans', sans-serif; 
            background-color: #0b132b; 
            color: #e0e6ed; 
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .header {
            background: #1c2541;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #3a506b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h1 { 
            font-size: 1.4rem; 
            color: #48cae4; 
            margin-bottom: 6px;
            font-weight: 700;
        }
        .sub-header {
            color: #52b788; 
            font-size: 0.95rem;
            font-weight: 500;
        }
        .file-card {
            background: #1c2541;
            border-radius: 12px;
            border: 1px solid #3a506b;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .dir-title {
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #3a506b;
            font-weight: 400;
        }
        ul { 
            list-style: none; 
        }
        li {
            margin-bottom: 8px;
        }
        li:last-child {
            margin-bottom: 0;
        }
        a { 
            display: block;
            color: #90e0ef; 
            text-decoration: none; 
            padding: 12px 14px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 400;
            word-break: break-all;
        }
        a:hover, a:active { 
            background-color: #3a506b;
            color: #52b788; 
            transform: translateX(3px);
        }
        .footer {
            text-align: center;
            color: #e0e6ed;
            font-size: 0.9rem;
            margin-top: 30px;
            padding: 10px 0;
            font-weight: 700;
        }

        /* Mobil Telefon Uyumluluğu */
        @media (max-width: 600px) {
            body { padding: 12px 10px; }
            .header { padding: 15px; }
            h1 { font-size: 1.2rem; }
            .sub-header { font-size: 0.85rem; }
            a { padding: 14px 10px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bursa Uludağ Üniversitesi</h1>
            <div class="sub-header">Elektronik Teknolojisi Programı</div>
        </div>

        <div class="file-card">
            <div class="dir-title">Dizin Listesi /</div>
            <ul>
                <li><a href="Figure_1.png">Figure_1.png</a></li>
                <li><a href="Figure_2.png">Figure_2.png</a></li>
                <li><a href="Figure_3.png">Figure_3.png</a></li>
            </ul>
        </div>
    </div>

    <div class="footer">
        BUÜ Elektronik Teknolojisi
    </div>
</body>
</html>
